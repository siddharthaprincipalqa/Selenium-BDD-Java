name: BDD Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to run'
        required: true
        default: '@smoke'
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          CUCUMBER_TAGS: ${{ inputs.tags || '@smoke or @regression' }}
        run: mvn --batch-mode clean test "-Dcucumber.filter.tags=$CUCUMBER_TAGS"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/cucumber-report.html
            target/surefire-reports/
          retention-days: 7